<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="经典马里奥横版网页游戏：第一世界四关、龟壳连击、隐藏奖励房和2–4人联机合作。"
    />
    <meta name="theme-color" content="#8585ff" />
    <title>马里奥网页游戏</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png" />
    <link rel="preload" href="assets/others/loading.gif" as="image" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/multiplayer.css" />
    <script src="vendor/phaser-3.55.2.min.js"></script>
    <script src="vendor/html2canvas-1.4.1.min.js"></script>
  </head>
  <body>
    <div id="game" hidden>
      <img
        id="gif"
        src="assets/others/loading.gif"
        alt="正在加载游戏"
        class="loading-gif"
      />
      <img
        id="gif-shadow"
        src="assets/others/loading.gif"
        alt=""
        class="loading-gif"
      />
    </div>
    <div id="coop-game" hidden></div>
    <main id="lobby" class="lobby">
      <div class="pixel-cloud cloud-a" aria-hidden="true"></div>
      <div class="pixel-cloud cloud-b" aria-hidden="true"></div>
      <section class="lobby-card" aria-labelledby="game-title">
        <div class="eyebrow">SUPER MARIO · WEB</div>
        <h1 id="game-title">马里奥 · 合作闯关</h1>
        <p class="intro">第一世界 1-1 → 1-4 · 草地、地下、树台与城堡。</p>
        <div id="entry-panel" class="hall-grid">
          <div class="hall-create">
            <label class="field-label" for="nickname">你的昵称</label>
            <input
              id="nickname"
              maxlength="16"
              autocomplete="nickname"
              placeholder="给自己起个名字"
              value="玩家"
            />
            <div class="room-options">
              <label for="room-visibility"
                >房间可见性<select id="room-visibility">
                  <option value="public">公开 · 大厅可加入</option>
                  <option value="private">私密 · 邀请好友</option>
                </select></label
              >
              <label for="stage-choice"
                >从哪关开始<select id="stage-choice">
                  <option value="1-1">1-1 草地 · 连续闯关</option>
                  <option value="1-2">1-2 地下</option>
                  <option value="1-3">1-3 树台</option>
                  <option value="1-4">1-4 城堡</option>
                </select></label
              >
            </div>
            <button id="create-room" class="primary">
              创建合作房间 <span>2–4 人</span>
            </button>
            <form id="join-form" class="join-form">
              <label class="sr-only" for="room-code">六位房间码</label>
              <input
                id="room-code"
                maxlength="6"
                autocapitalize="characters"
                autocomplete="off"
                placeholder="输入 6 位房间码"
                required
                pattern="[A-Za-z2-9]{6}"
              />
              <button id="join-room" type="submit" class="secondary">
                加入
              </button>
            </form>
            <button id="classic-mode" class="plain">单人挑战第一世界</button>
            <button id="random-mode" class="plain subtle">单人随机关卡</button>
          </div>
          <section class="public-hall" aria-labelledby="hall-title">
            <div class="hall-heading">
              <h2 id="hall-title">联机大厅</h2>
              <button id="refresh-hall" class="small">刷新</button>
            </div>
            <p id="hall-count" class="hint">正在读取在线房间…</p>
            <div
              id="public-rooms"
              class="public-rooms"
              aria-live="polite"
            ></div>
            <button id="quick-join" class="secondary">快速加入</button>
            <p class="hint hall-tip">
              优先加入等待中的公开房间，没有空位时为你创建房间。
            </p>
          </section>
          <p class="hint controls-hint">
            电脑：A / D 移动，空格跳跃，S / ↓ 蹲下或入管，Shift 奔跑，Q
            发射火球。手机：使用屏幕按键。
          </p>
        </div>
        <div id="room-panel" hidden>
          <div class="room-heading">
            <span>房间 <strong id="room-label"></strong></span
            ><button id="copy-invite" class="small">复制邀请链接</button>
          </div>
          <p id="room-meta" class="room-meta"></p>
          <ul id="players" class="players" aria-label="房间玩家"></ul>
          <p id="room-help" class="hint">邀请朋友加入，再一起准备。</p>
          <div class="room-actions">
            <button id="ready-button" class="secondary">准备</button
            ><button id="start-button" class="primary">开始闯关</button>
          </div>
          <button id="leave-lobby" class="plain">离开房间</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
      <img
        class="lobby-mario"
        src="assets/entities/mario-grown.png"
        alt=""
        aria-hidden="true"
      />
      <div class="pixel-ground" aria-hidden="true"></div>
      <footer>第一世界 · 公开大厅 · 好友合作</footer>
    </main>
    <div id="game-toolbar" class="game-toolbar" hidden>
      <div>
        <strong id="stage-label">1-1</strong
        ><strong id="team-score">团队分数 000000</strong
        ><span id="team-coins">金币 0</span><span id="game-time">时间 300</span>
      </div>
      <div>
        <span id="connection-state">已连接</span
        ><button id="mute-button" class="small" aria-pressed="false">
          声音开</button
        ><button id="leave-game" class="small">退出房间</button>
      </div>
      <p id="team-members"></p>
    </div>
    <div id="round-message" class="round-message" hidden>
      <h2 id="round-title"></h2>
      <p id="round-detail"></p>
      <button id="again-button" class="primary" hidden>
        返回房间，再来一局
      </button>
    </div>
    <div
      id="touch-controls"
      class="touch-controls"
      hidden
      aria-label="触屏游戏按键"
    >
      <div class="direction-pad">
        <button data-control="left" aria-label="向左移动">◀</button
        ><button data-control="right" aria-label="向右移动">▶</button
        ><button data-control="down" aria-label="蹲下或进入水管">↓</button>
      </div>
      <div>
        <button data-control="fire" aria-label="发射火球">火球</button
        ><button data-control="jump" class="jump" aria-label="跳跃">
          跳跃
        </button>
      </div>
    </div>
    <button id="back-classic" class="classic-back" hidden>返回选模式</button>

    <noscript>
      <div class="blurbg">
        <div class="alertpopup">
          <h2>请启用 JavaScript</h2>
          <hr />
          <p>这款游戏需要 JavaScript 才能运行。</p>
          <p>请在浏览器中启用 JavaScript 后重新加载。</p>
        </div>
      </div>
    </noscript>

    <script src="./javascript/game.js" type="text/javascript"></script>
    <script
      src="./javascript/game/animations.js"
      type="text/javascript"
    ></script>
    <script src="./javascript/game/blocks.js" type="text/javascript"></script>
    <script
      src="./javascript/game/strucutres.js"
      type="text/javascript"
    ></script>
    <script src="./javascript/game/settings.js" type="text/javascript"></script>
    <script src="./javascript/game/fireball.js" type="text/javascript"></script>
    <script
      src="./javascript/game/player-control.js"
      type="text/javascript"
    ></script>
    <script
      src="./javascript/game/hud-control.js"
      type="text/javascript"
    ></script>
    <script
      src="./javascript/game/entities-control.js"
      type="text/javascript"
    ></script>
    <script
      src="./javascript/helpers/screenshot.js"
      type="text/javascript"
    ></script>
    <script src="./javascript/multiplayer.js" defer></script>
  </body>
</html>
